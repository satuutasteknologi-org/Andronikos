# Downscaler Training Configuration

# Model architecture
model:
  input_dim: 14
  output_dim: 24
  num_variables: 6
  num_quantiles: 4
  hidden_dims: [256, 512, 512, 256]
  dropout: 0.1
  activation: "silu"
  quantiles: [0.1, 0.5, 0.9]

# Data configuration
data:
  coarse_forecast_path: "/data/coarse_forecast"
  elevation_path: "/data/elevation.nc"
  land_mask_path: "/data/land_mask.nc"
  observation_path: "/data/observations"
  start_date: "2010-01-01"
  end_date: "2023-12-31"
  lead_times: [6, 12, 18, 24, 48, 72]  # hours
  batch_size: 64
  num_workers: 4

# Training configuration
training:
  experiment_name: "downscaler_indonesia_v1"
  seed: 42
  use_wandb: false
  
  devices: 1
  strategy: "auto"
  precision: "16-mixed"
  
  max_epochs: 50
  batch_size: 64
  num_workers: 4
  val_check_interval: 1.0
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  patience: 10
  
  lr: 1e-3
  weight_decay: 1e-4
  
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  log_every_n_steps: 50
  
  save_top_k: 3
  save_last: true

# Loss configuration
loss:
  quantiles: [0.1, 0.5, 0.9]
  quantile_weight: 1.0
  bce_weight: 0.5
  mse_weight: 0.1

# Export
export:
  formats: ["onnx"]
  dummy_input_shape: [1, 14]