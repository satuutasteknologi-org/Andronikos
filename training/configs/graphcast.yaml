# GraphCast Training Configuration

# Model architecture
model:
  hidden_dim: 256
  num_layers: 12
  num_heads: 8
  surface_vars: 5
  atmosphere_vars: 6
  pressure_levels: 13
  dropout: 0.1

# Data configuration
data:
  era5_path: "/data/era5"
  era5_single_level: "era5_single_level.nc"
  era5_pressure_level: "era5_pressure_level.nc"
  start_date: "2010-01-01"
  end_date: "2023-12-31"
  history_steps: 4
  forecast_steps: 1
  lat_min: -11.0
  lat_max: 6.1
  lon_min: 95.0
  lon_max: 141.1

# Training configuration
training:
  # Experiment
  experiment_name: "graphcast_indonesia_v1"
  seed: 42
  use_wandb: false
  
  # Hardware
  devices: 1
  strategy: "auto"
  precision: "16-mixed"
  
  # Training
  max_epochs: 100
  batch_size: 32
  num_workers: 4
  val_check_interval: 1.0
  log_every_n_steps: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  patience: 10
  
  # Optimization
  lr: 1e-4
  weight_decay: 1e-5
  
  # Loss
  loss_weights:
    mse: 1.0
    spectral: 0.2
  spectral_weight: 0.2
  
  # Logging
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  log_every_n_steps: 50
  
  # Checkpoint
  save_top_k: 3
  save_last: true

# Data paths
paths:
  data_root: "/data/era5"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  export_dir: "./exports"

# Export settings
export:
  formats: ["burn", "onnx"]
  dummy_input_shape: [1, 100, 20]  # [batch, nodes, features]