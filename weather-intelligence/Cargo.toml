[workspace]
members = [
    "crates/wi-core",
    "crates/wi-grid",
    "crates/wi-ingest",
    "crates/wi-storage",
    "crates/wi-model",
    "crates/wi-verify",
    "crates/wi-api",
    "crates/wi-cli",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.80"
authors = ["Weather Intelligence Team"]
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Unified Weather Intelligence Engine - Global + Indonesia Downscaling"

[workspace.dependencies]
# Async Runtime & Networking
tokio = { version = "1.40", features = ["full", "tracing", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream", "gzip"] }
async-stream = "0.1"
futures = { version = "0.3", features = ["async-await", "compat"] }
http = "1.1"
hyper = "1.4"
tower = { version = "0.5", features = ["util", "filter", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["util", "limit", "timeout", "cors", "compression-gzip", "tracing", "trace"] }
axum = { version = "0.8", features = ["json", "form", "multipart"] }

# Data Processing & Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
arrow = { version = "54.0", features = ["ipc", "csv", "json"] }
parquet = { version = "54.0", features = ["arrow", "lz4", "zstd", "brotli", "async"] }
ndarray = { version = "0.17", features = ["approx", "rayon"] }
ndarray-rand = "0.17"
rand = "0.9"
rand_distr = "0.4"

# Geospatial
geo = "0.30"
geo-types = "0.7"
geojson = "1.0"
h3o = "0.9"
proj = "0.4"
rtree = "0.12"
sha2 = "0.10"

# ML / Deep Learning - burn 0.22 features
burn = { version = "0.22", default-features = false, features = ["std", "autodiff", "train"] }
burn-ndarray = { version = "0.22", features = ["blas-openblas"] }
burn-wgpu = "0.22"
burn-cuda = "0.22"

# ONNX Inference (pre-release)
ort = { version = "2.0.0-rc.14", features = ["ndarray"] }

# Numerical & Scientific
ndarray-stats = "0.6"
statrs = "0.18"
num = "0.4"
mint = "0.5"
urgency = "1.1"
bincode = "1.3"

# Configuration & Logging
figment = { version = "0.10", features = ["env", "toml", "yaml", "json", "serde_json", "serde_yaml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"
opentelemetry = "0.29"
opentelemetry-otlp = "0.29"
prometheus = "0.14"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "2.0"
eyre = "0.6"
color-eyre = "0.6"
indicatif = { version = "0.18", features = ["improved_unicode"] }
once_cell = "1.20"
parking_lot = "0.12"
dashmap = "6.0"
indexmap = "2.7"
smallvec = { version = "1.14", features = ["union", "serde"] }
triomphe = "0.1"
bytesize = "1.0"
async-trait = "0.1"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4.31", features = ["serde"] }
time = "0.3"
humantime = "2.1"

# Auth
jsonwebtoken = { version = "9", features = ["pem"] }

# Filesystem & Storage
tempfile = "3.16"
walkdir = "2.5"
notify = "7.0"
fs4 = "0.11"
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "json", "migrate", "macros"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "script"] }

# gRPC / Protobuf
tonic = "0.13"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"

# Compression
zstd = "0.13"
lz4_flex = "0.11"
brotli = "7.0"
flate2 = "1.0"

# Parallel CPU
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive", "env", "cargo", "help", "usage", "string"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1

[profile.bench]
inherits = "release"
debug = true




