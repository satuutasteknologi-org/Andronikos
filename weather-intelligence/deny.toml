[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "CC-BY-4.0"]
deny = ["GPL-3.0", "AGPL-3.0"]
confidence-threshold = 0.8

[advisories]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
crates-io = "https://github.com/rust-lang/crates.io-index"
