[package]
name = "andronikos-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_axum = { version = "0.6", optional = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "CssStyleDeclaration",
] }
js-sys = "0.3"
console_log = "0.2"
console_error_panic_hook = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"], optional = true }

[features]
ssr = ["leptos_axum", "reqwest"]
csr = []

[lib]
crate-type = ["cdylib", "rlib"]
