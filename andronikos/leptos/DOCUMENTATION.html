<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Andronikos - Tower of the Winds untuk Nusantara</title>
  <meta name="description" content="Informasi risiko dampak cuaca per unit wilayah Indonesia - Enterprise Weather Intelligence" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../logoand.jpg">

  <!-- MapLibre GL JS CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <!-- Andronikos Design System - Enterprise UI -->
  <style>
    :root {
      --bg: #0b1120;
      --bg-card: #141c2e;
      --bg-card-hover: #1a263e;
      --bg-sidebar: #080c16;
      --accent: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-muted: rgba(56, 189, 248, 0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: #1e293b;
      --border-hover: #334155;
      --success: #22c55e;
      --success-muted: rgba(34, 197, 94, 0.1);
      --warning: #f59e0b;
      --warning-muted: rgba(245, 158, 11, 0.1);
      --error: #ef4444;
      --error-muted: rgba(239, 68, 68, 0.1);
      --info: #38bdf8;
      --info-muted: rgba(56, 189, 248, 0.1);
      --radius: 10px;
      --radius-lg: 16px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 0.95rem;
      overflow: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; color: var(--text); line-height: 1.25; margin: 0; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; }
    h2 { font-size: 1.5rem; letter-spacing: -0.01em; }
    h3 { font-size: 1.25rem; letter-spacing: -0.01em; }
    h4 { font-size: 1rem; font-weight: 600; }
    p { margin: 0 0 1rem 0; color: var(--text-muted); font-size: 0.925rem; }

    /* Layout */
    .app-shell {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
      background: linear-gradient(180deg, rgba(8, 12, 22, 0.95) 0%, rgba(8, 12, 22, 0.7) 100%);
      border-right: 1px solid var(--border); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100; transition: transform 0.3s; display: flex; flex-direction: column;
    }
    .sidebar.hidden { transform: translateX(-100%); }
    .sidebar-header { padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); }
    .sidebar-brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #7dd3ff); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px -2px rgba(56, 189, 248, 0.3); }

    /* Tower of the Winds Logo Brand — Right-side floating (10% alpha, precision positioned, premium glass) */
    @keyframes towerPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,0.20)}50%{box-shadow:0 0 0 6px rgba(34,211,238,0.10)}}
    .tower-logo-brand {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(34, 211, 238, 0.20);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      animation: towerPulse 4s ease-in-out infinite;
    }
    .tower-logo-brand:hover {
      transform: translateY(-3px) scale(1.08);
      border-color: rgba(34, 211, 238, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 20px rgba(34, 211, 238, 0.25);
      animation: none;
    }
    .tower-logo-brand .tower-logo-img {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 12px;
      filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.35));
      transition: filter 0.4s ease;
    }
    .tower-logo-brand:hover .tower-logo-img {
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.55));
    }
    .sidebar-brand-text { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .sidebar-subtitle { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem; }
    .nav-group { margin-bottom: 1rem; padding: 0 1.5rem; }
    .nav-group-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--text-dim); margin-bottom: 0.5rem; }
    .nav-item { margin-bottom: 0.2rem; }
    .nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.85rem; color: var(--text-muted); border-radius: 0.75rem; font-size: 0.875rem; transition: all var(--transition); text-decoration: none; background: transparent; text-align: left; cursor: pointer; width: 100%; border: none; }
    .nav-link:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); border-left: 3px solid var(--accent); padding-left: 0.62rem; }
    .nav-link.active { background: rgba(56, 189, 248, 0.08); color: var(--accent); border-left: 3px solid var(--accent); }
    .nav-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-label { font-size: 0.85rem; }

    .main { margin-left: 260px; width: calc(100vw - 260px); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    @media (max-width: 1024px) {
      .sidebar { position: fixed; transform: translateX(-100%); z-index: 200; }
      .main { margin-left: 0; width: 100vw; }
      .mobile-toggle { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--border); color: var(--text); position: fixed; top: 1rem; left: 1rem; z-index: 300; border-radius: var(--radius-md); box-shadow: var(--shadow-md); }
    }

    /* Header */
    .header { position: sticky; top: 0; z-index: 50; height: 64px; background: linear-gradient(180deg, rgba(8, 12, 22, 0.9) 0%, rgba(8, 12, 22, 0.6) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1.5rem; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-title { font-family: var(--font-heading); font-size: 1.125rem; font-weight: 700; color: var(--text); }
    .header-subtitle { font-size: 0.75rem; color: var(--text-muted); }
    .header-center { flex: 1; max-width: 560px; position: relative; }
    .header-search { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0.625rem 1rem; color: var(--text); font-size: 0.875rem; transition: all var(--transition); }
    .header-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.1); }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .btn-icon { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-muted); transition: all var(--transition); cursor: pointer; }
    .btn-icon:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-hover); }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #7dd3ff); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #000; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .user-role { font-size: 0.7rem; color: var(--text-muted); }

    /* Main Content */
    .main-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .page-title { font-family: var(--font-heading); font-size: 1.75rem; font-weight: 800; color: var(--text); margin: 0; }
    .page-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem; }
    .page-actions { display: flex; align-items: center; gap: 0.75rem; }

    /* Buttons */
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 0.625rem 1.5rem; background: linear-gradient(135deg, var(--accent), #7dd3ff); border: none; border-radius: var(--radius-md); color: #000; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: all var(--transition); }
    .btn-primary:hover { background: linear-gradient(135deg, #7dd3ff, var(--accent)); box-shadow: 0 8px 24px -4px rgba(56,189,248,0.4); }
    .btn-secondary { display: inline-flex; align-items: center; justify-content: center; padding: 0.625rem 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text); font-weight: 500; font-size: 0.875rem; cursor: pointer; transition: all var(--transition); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-hover); }
    .btn-icon { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-muted); transition: all var(--transition); cursor: pointer; }
    .btn-icon:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-hover); }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin: 1.5rem 0; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; transition: all 0.25s; }
    .card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    .card-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* Stat Card */
    .stat-card { background: linear-gradient(135deg, var(--surface) 0%, rgba(255,255,255,0.03) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; transition: all 0.25s; }
    .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.75rem; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-change { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-weight: 600; }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--error); }
    .stat-change.neutral { color: var(--text-muted); }

    /* Panels */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; }
    .panel-title { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-verified { background: rgba(34,197,94,0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
    .badge-partial { background: rgba(245,158,11,0.1); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .badge-experimental { background: rgba(148,163,184,0.1); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.2); }
    .badge-not { background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid rgba(239,68,68,0.2); }
    .badge-source { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; }

    /* Status Badge */
    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.pending { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .status-dot.error { background: var(--error); box-shadow: 0 0 8px var(--error); }

    /* Progress */
    .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; margin-top: 0.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7dd3ff); border-radius: 3px; transition: width 0.6s ease; }

    /* Table */
    .table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .table th { text-align: left; padding: 0.75rem 1rem; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    .table td { padding: 0.75rem 1rem; color: var(--text); border-bottom: 1px solid var(--border); }
    .table tbody tr:hover { background: rgba(255,255,255,0.03); }

    /* Empty State */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1rem; text-align: center; color: var(--text-muted); }
    .empty-state-icon { width: 64px; height: 64px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-size: 2rem; }
    .empty-state-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
    .empty-state-desc { font-size: 0.85rem; color: var(--text-muted); max-width: 300px; line-height: 1.5; }

    /* Alerts */
    .alert { padding: 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1rem; }
    .alert-info { background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.15); color: var(--accent); }
    .alert-warning { background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.15); color: var(--warning); }
    .alert-error { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15); color: var(--error); }

    /* Map */
    #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 0; }
    .maplibregl-ctrl-attrib { display: none !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-row { flex-direction: row; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .p-1 { padding: 0.25rem; }
    .p-2 { padding: 0.5rem; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .hidden { display: none !important; }
    .block { display: block; }
    .inline-block { display: inline-block; }
    .rounded-sm { border-radius: var(--radius-sm); }
    .rounded-md { border-radius: var(--radius-md); }
    .rounded-lg { border-radius: var(--radius-lg); }
    .rounded-xl { border-radius: var(--radius-xl); }
    .rounded-full { border-radius: var(--radius-full); }
    .border { border: 1px solid var(--border); }
    .border-t { border-top: 1px solid var(--border); }
    .border-b { border-bottom: 1px solid var(--border); }
    .opacity-50 { opacity: 0.5; }
    .opacity-70 { opacity: 0.7; }
    .overflow-hidden { overflow: hidden; }
    .overflow-auto { overflow: auto; }
    .cursor-pointer { cursor: pointer; }
    .cursor-not-allowed { cursor: not-allowed; }

    /* Mapbox style override */
    .maplibregl-ctrl-attrib { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Tower of the Winds Logo — Brand icon untuk documentation -->
  <div class="tower-logo-brand" title="Andronikos — Tower of the Winds untuk Nusantara">
    <img src="../logoand.jpg" alt="Andronikos — Tower of the Winds untuk Nusantara" class="tower-logo-img" />
  </div>

  <div class="app-shell">
    <div id="app-mount"></div>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script type="module">
    import { mount } from "./pkg/andronikos_ui.js";
    mount();
  </script>
</body>
</html>
