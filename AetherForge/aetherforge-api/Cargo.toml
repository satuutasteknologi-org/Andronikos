[package]
name = "aetherforge-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "REST/gRPC API Server for AetherForge Weather Inference"
license.workspace = true

[[bin]]
name = "aetherforge-serve"
path = "src/bin/aetherforge-serve.rs"

[dependencies]
aetherforge-core = { path = "../aetherforge-core" }
aetherforge-ml = { path = "../aetherforge-ml" }

tokio.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true

axum.workspace = true

tonic.workspace = true
prost.workspace = true
prost-types = "0.13"

serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

figment.workspace = true
anyhow.workspace = true
thiserror.workspace = true

metrics.workspace = true
metrics-exporter-prometheus.workspace = true
prometheus.workspace = true

parking_lot.workspace = true

chrono.workspace = true

async-stream = "0.1"

[build-dependencies]
tonic-build = "0.13"
prost-build = "0.13"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio", "server"] }
tokio-test = "0.4"
