[package]
name = "aetherforge-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "God-Tier Leptos HMI for AetherForge Weather Engine"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "console", "WebSocket", "MessageEvent", "ErrorEvent", "Event", "EventTarget", "Storage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-wasm = "0.2"
anyhow = "1.0"
futures = "0.3"
