# Registri variabel dan sumber Andronikos (per 15 Oktober 2026)
# status: terverifikasi | sebagian | belum
sumber:
  # A. Prakiraan dan model (dinamis, ke depan)
  - id: "met.gfs"
    sumber: "NOAA GFS"
    sifat: "dinamis"
    variabel: "hujan, angin, suhu, kelembapan (daftar variabel belum dicek)"
    modul: "semua"
    resolusi_frekuensi: "4x/hari, sekitar 28 km, hingga 16 hari"
    pemilik: "NOAA"
    akses: "terbuka, atribusi"
    status: "sebagian"
    catatan: "Dasar fisika. Variabel dari pengetahuan umum."
  - id: "met.gefs"
    sumber: "NOAA GEFS"
    sifat: "dinamis"
    variabel: "ensemble untuk variabel yang sama dengan GFS"
    modul: "semua"
    resolusi_frekuensi: "4x/hari, hingga 16 hari"
    pemilik: "NOAA"
    akses: "terbuka, atribusi"
    status: "sebagian"
    catatan: "Dasar probabilitas."
  - id: "met.aigfs"
    sumber: "NOAA AIGFS"
    sifat: "dinamis"
    variabel: "angin 10 m, suhu 2 m, tekanan permukaan laut, total presipitasi"
    modul: "semua"
    resolusi_frekuensi: "0,25 derajat, per 6 jam, hingga 384 jam"
    pemilik: "NOAA"
    akses: "hanya NOMADS, sekitar 120 hit/menit (perlu dicek)"
    status: "terverifikasi"
    catatan: "Anggota tambahan, bukan dasar."
  - id: "met.aigefs"
    sumber: "NOAA AIGEFS (31 anggota)"
    sifat: "dinamis"
    variabel: "sama dengan AIGFS"
    modul: "semua"
    resolusi_frekuensi: "0,25 derajat, per 6 jam, hingga 384 jam"
    pemilik: "NOAA"
    akses: "sama dengan AIGFS"
    status: "terverifikasi"
    catatan: "Untuk probabilitas risiko per anggota."
  - id: "met.hgefs"
    sumber: "NOAA HGEFS (62 anggota)"
    sifat: "dinamis"
    variabel: "gabungan AIGEFS dan GEFSv12"
    modul: "semua"
    resolusi_frekuensi: "hingga 240 jam"
    pemilik: "NOAA"
    akses: "sama dengan AIGFS"
    status: "terverifikasi"
    catatan: "Tidak independen dari GEFS dan AIGEFS."
  - id: "met.bmkg_fc"
    sumber: "BMKG prakiraan terbuka"
    sifat: "dinamis"
    variabel: "suhu, kelembapan, deskripsi cuaca, angin, tutupan awan, jarak pandang"
    modul: "hujan, angin"
    resolusi_frekuensi: "3 hari, per 3 jam, kelurahan/desa, 2x/hari"
    pemilik: "BMKG"
    akses: "atribusi wajib, 60 permintaan/menit/IP, izin tertulis untuk komersial"
    status: "terverifikasi"
    catatan: "Curah hujan mm tidak ada di daftar parameter."
  - id: "met.bmkg_nowcast"
    sumber: "BMKG peringatan dini (CAP)"
    sifat: "dinamis"
    variabel: "peringatan cuaca ekstrem"
    modul: "hujan, air"
    resolusi_frekuensi: "kecamatan, diperbarui setiap saat"
    pemilik: "BMKG"
    akses: "atribusi wajib, 60 permintaan/menit/IP, syarat komersial perlu dikonfirmasi"
    status: "terverifikasi"
    catatan: "Pembanding, bukan masukan model."
  - id: "met.graphcast"
    sumber: "GraphCast/GenCast"
    sifat: "dinamis"
    variabel: "keluaran model AI dijalankan sendiri"
    modul: "semua"
    resolusi_frekuensi: "-"
    pemilik: "DeepMind"
    akses: "kode Apache 2.0, bobot CC BY-NC-SA 4.0"
    status: "terverifikasi"
    catatan: "Dikecualikan untuk produk komersial."
  - id: "met.openmeteo"
    sumber: "Open-Meteo"
    sifat: "dinamis"
    variabel: "agregasi model lain"
    modul: "prototipe"
    resolusi_frekuensi: "-"
    pemilik: "Open-Meteo"
    akses: "gratis non-komersial, di bawah 10.000 panggilan/hari, CC BY 4.0"
    status: "terverifikasi"
    catatan: "Tidak independen. Jangan masuk gabungan bersama NOAA dan ERA5."
  - id: "nowcast.radar"
    sumber: "Nowcasting radar"
    sifat: "dinamis"
    variabel: "hujan 0 sampai 3 jam"
    modul: "hujan"
    resolusi_frekuensi: "-"
    pemilik: "BMKG (kandidat)"
    akses: "belum ada kemitraan"
    status: "belum"
    catatan: "Menunggu status kemitraan BMKG."
  # B. Pengamatan, hujan lampau, dan referensi
  - id: "obs.bmkg_stn"
    sumber: "BMKG pengamatan stasiun"
    sifat: "dinamis"
    variabel: "hujan dan cuaca stasiun"
    modul: "semua"
    resolusi_frekuensi: "-"
    pemilik: "BMKG"
    akses: "Perka BMKG 4/2022, formulir via PTSP, komersial kena PNBP (tarif belum dicek)"
    status: "sebagian"
    catatan: "Verifikasi dan koreksi bias."
  - id: "obs.isd"
    sumber: "NOAA ISD"
    sifat: "dinamis"
    variabel: "pengamatan stasiun global"
    modul: "semua"
    resolusi_frekuensi: "sekitar 14.000 stasiun aktif, harian"
    pemilik: "NOAA"
    akses: "terbuka, atribusi"
    status: "terverifikasi"
    catatan: "Gabungan banyak sumber. Perlu QC."
  - id: "obs.gpm"
    sumber: "GPM"
    sifat: "dinamis"
    variabel: "hujan satelit, kumulatif 1 dan 3 hari"
    modul: "longsor, banjir"
    resolusi_frekuensi: "belum dicek"
    pemilik: "NASA"
    akses: "lisensi belum dicek"
    status: "sebagian"
    catatan: "Dipakai ILEWS. Uji terhadap stasiun pilot."
  - id: "obs.gsmap"
    sumber: "GSMaP"
    sifat: "dinamis"
    variabel: "hujan satelit"
    modul: "longsor"
    resolusi_frekuensi: "belum dicek"
    pemilik: "JAXA"
    akses: "lisensi belum dicek"
    status: "sebagian"
    catatan: "Dipakai studi DAS Progo."
  - id: "ref.era5"
    sumber: "ERA5 (Copernicus/ECMWF)"
    sifat: "dinamis"
    variabel: "reanalisis cuaca"
    modul: "pelatihan"
    resolusi_frekuensi: "sekitar 31 km, per jam, tertinggal 3 sampai 5 hari"
    pemilik: "ECMWF"
    akses: "Copernicus v1.2, atribusi dan penafian wajib"
    status: "terverifikasi"
    catatan: "Bukan masukan real-time. Bukan pembanding verifikasi."
  - id: "obs.river_wl"
    sumber: "Tinggi muka air dan debit sungai"
    sifat: "dinamis"
    variabel: "tinggi muka air, debit"
    modul: "banjir"
    resolusi_frekuensi: "-"
    pemilik: "PU/BWS, dinas daerah (kandidat)"
    akses: "tidak ada API nasional terbuka"
    status: "belum"
    catatan: "Urus per DAS lewat kemitraan. Contoh: AWLR DKI, dasbor Kab. Malang."
  - id: "obs.tide"
    sumber: "Pasang laut"
    sifat: "dinamis"
    variabel: "pasang surut"
    modul: "banjir rob"
    resolusi_frekuensi: "-"
    pemilik: "belum teridentifikasi"
    akses: "-"
    status: "belum"
    catatan: "Disebut sebagai input banjir rob."
  - id: "obs.soil_moist"
    sumber: "Sensor kelembapan tanah"
    sifat: "dinamis"
    variabel: "kelembapan tanah"
    modul: "longsor"
    resolusi_frekuensi: "-"
    pemilik: "belum ada"
    akses: "-"
    status: "belum"
    catatan: "Opsional."
  - id: "obs.pm25"
    sumber: "PM2.5"
    sifat: "dinamis"
    variabel: "kualitas udara"
    modul: "asap"
    resolusi_frekuensi: "-"
    pemilik: "BMKG (kandidat)"
    akses: "belum dicek"
    status: "belum"
    catatan: "Pemantauan PM2.5 BMKG disebut di bagian 3."
  - id: "obs.himawari"
    sumber: "Himawari"
    sifat: "dinamis"
    variabel: "deteksi titik panas satelit geostasioner"
    modul: "asap"
    resolusi_frekuensi: "-"
    pemilik: "belum dicek"
    akses: "belum dicek"
    status: "belum"
    catatan: "Disebut sebagai contoh sumber titik panas."
  # C. Lapisan statis lahan
  - id: "geo.demnas"
    sumber: "DEMNAS"
    sifat: "statis"
    variabel: "elevasi"
    modul: "longsor, banjir"
    resolusi_frekuensi: "0,27 arc-second (sekitar 8 m)"
    pemilik: "BIG"
    akses: "dapat diunduh sesuai ketentuan BIG"
    status: "sebagian"
    catatan: "Galat vertikal 1,8 sampai 6,1 m. Jenis permukaan (vegetasi atau tanah) belum diverifikasi."
  - id: "geo.dem_derived"
    sumber: "Turunan DEM"
    sifat: "statis"
    variabel: "kemiringan, kelengkungan, indeks kebasahan topografi, akumulasi aliran"
    modul: "longsor, banjir"
    resolusi_frekuensi: "per unit analisis"
    pemilik: "dihitung sendiri"
    akses: "mengikuti lisensi DEMNAS"
    status: "sebagian"
    catatan: "Dihitung sekali per unit, jarang diperbarui."
  - id: "geo.pvmbg_zone"
    sumber: "Zona Kerentanan Gerakan Tanah (Portal MBG)"
    sifat: "statis"
    variabel: "kelas hijau, kuning, merah"
    modul: "longsor"
    resolusi_frekuensi: "skala belum dicek"
    pemilik: "Badan Geologi (PVMBG)"
    akses: "dilihat publik, hak unduh belum dicek"
    status: "sebagian"
    catatan: "Prior kerentanan, sudah memuat lereng dan geologi."
  - id: "geo.peat"
    sumber: "Gambut (KHG)"
    sifat: "statis"
    variabel: "sebaran dan fungsi ekosistem gambut"
    modul: "asap"
    resolusi_frekuensi: "1:250.000 (nilai tertinggal: 865 KHG, 24,7 juta ha, 2017)"
    pemilik: "belum dicek"
    akses: "belum dicek"
    status: "sebagian"
    catatan: "Skala kasar, luasan beda antar lembaga."
  - id: "geo.landcover"
    sumber: "Tutupan lahan"
    sifat: "statis"
    variabel: "kelas tutupan lahan"
    modul: "banjir, longsor, asap"
    resolusi_frekuensi: "-"
    pemilik: "belum teridentifikasi"
    akses: "-"
    status: "belum"
    catatan: "Celah nyata untuk limpasan banjir."
  - id: "geo.soil"
    sumber: "Jenis tanah"
    sifat: "statis"
    variabel: "tekstur dan jenis tanah"
    modul: "banjir"
    resolusi_frekuensi: "-"
    pemilik: "belum teridentifikasi"
    akses: "-"
    status: "belum"
    catatan: "Celah nyata. Untuk longsor, litologi dicakup zona PVMBG."
  - id: "geo.drainage"
    sumber: "Drainase"
    sifat: "statis"
    variabel: "jaringan drainase"
    modul: "banjir"
    resolusi_frekuensi: "-"
    pemilik: "belum teridentifikasi"
    akses: "-"
    status: "belum"
    catatan: "Celah nyata."
  - id: "geo.boundary"
    sumber: "Batas wilayah (RBI, Ina-Geoportal/TanahAir)"
    sifat: "statis"
    variabel: "poligon administrasi"
    modul: "semua"
    resolusi_frekuensi: "-"
    pemilik: "BIG"
    akses: "sesuai ketentuan BIG"
    status: "sebagian"
    catatan: "Batas desa RBI indikatif. Pakai batas definitif untuk pemotongan."
  - id: "geo.exposure"
    sumber: "Paparan (kota, sekolah, penerbangan, penduduk)"
    sifat: "statis"
    variabel: "lokasi terpapar"
    modul: "semua"
    resolusi_frekuensi: "-"
    pemilik: "belum teridentifikasi"
    akses: "-"
    status: "belum"
    catatan: "Disebut di bagian 3 sebagai komponen risiko."
  # D. Titik panas, kejadian, dan validasi
  - id: "fire.firms"
    sumber: "NASA FIRMS (VIIRS 375 m, MODIS 1 km)"
    sifat: "dinamis"
    variabel: "titik panas"
    modul: "asap"
    resolusi_frekuensi: "tersedia sekitar 3 jam setelah lintasan"
    pemilik: "NASA"
    akses: "terbuka, acknowledgment wajib"
    status: "terverifikasi"
    catatan: "Titik panas bukan koordinat pasti api."
  - id: "fire.sipongi"
    sumber: "SiPongi+"
    sifat: "dinamis"
    variabel: "titik panas dengan pencocokan wilayah"
    modul: "asap"
    resolusi_frekuensi: "-"
    pemilik: "Kementerian Kehutanan"
    akses: "publik, syarat penggunaan ulang belum dicek"
    status: "sebagian"
    catatan: "Sensor sama dengan FIRMS. Jangan dihitung dua kali."
  - id: "fire.brin"
    sumber: "Hotspot BRIN (VIIRS)"
    sifat: "dinamis"
    variabel: "titik panas tersaring (tanpa tambang)"
    modul: "asap"
    resolusi_frekuensi: "-"
    pemilik: "BRIN"
    akses: "belum dicek"
    status: "sebagian"
    catatan: "Untuk membedakan titik panas dari kebakaran lahan."
  - id: "fire.drought"
    sumber: "Indeks kekeringan"
    sifat: "dinamis"
    variabel: "kekeringan"
    modul: "asap"
    resolusi_frekuensi: "-"
    pemilik: "belum ditentukan"
    akses: "-"
    status: "belum"
    catatan: "Sumber dan rumus belum diputuskan."
  - id: "evt.bnpb"
    sumber: "BNPB (inaRISK dan DIBI)"
    sifat: "statis"
    variabel: "risiko dan kejadian bencana"
    modul: "validasi"
    resolusi_frekuensi: "agregat per kabupaten/kota"
    pemilik: "BNPB"
    akses: "publik, API dan lisensi belum dicek"
    status: "sebagian"
    catatan: "Kurang presisi untuk kalibrasi ambang."
  - id: "evt.study"
    sumber: "Inventaris studi terbitan"
    sifat: "statis"
    variabel: "420 kejadian longsor Jawa (ILEWS), 213 kejadian DAS Progo"
    modul: "longsor, validasi"
    resolusi_frekuensi: "-"
    pemilik: "penulis studi"
    akses: "lihat sumber"
    status: "sebagian"
    catatan: "Titik awal kalibrasi."
  - id: "evt.bpbd"
    sumber: "Basis data kejadian sendiri (usulan)"
    sifat: "dinamis"
    variabel: "waktu, koordinat, jenis kejadian"
    modul: "validasi"
    resolusi_frekuensi: "wilayah pilot"
    pemilik: "BPBD dan mitra"
    akses: "perlu kemitraan"
    status: "belum"
    catatan: "Ketiadaan laporan belum tentu berarti tidak ada kejadian."

# Tambahan v2.4 (usulan, belum diuji)
koreksi_bias:
  metode: "aditif: x_koreksi = x_prakiraan - b"
  variabel_aditif: ["suhu_2m", "tekanan_permukaan_laut", "angin_u10", "angin_v10", "kelembapan_relatif"]
  variabel_non_aditif: ["hujan"]
  alasan_non_aditif: "hujan tidak negatif dan miring ke kanan; pakai rasio, pemetaan kuantil, atau transformasi lalu batasi >= 0"
  kelompok_bias: ["variabel", "lead", "siklus_utc", "stasiun", "musim_bila_data_cukup"]
  pembaruan: "rata-rata bergerak eksponensial"
  alpha: "belum diputuskan"
  panjang_jendela: "belum diputuskan"
  acuan_pengamatan: ["obs.bmkg_stn", "obs.isd"]
  bukan_acuan: ["ref.era5"]
  ensemble: "b yang sama untuk semua anggota; kalibrasi sebaran terpisah"
  batas_fisik: {kelembapan_relatif: [0, 100], hujan_min: 0}
  reset_saat: "versi model berubah"
  cadangan: "pakai keluaran mentah bila tidak lebih baik pada periode validasi terpisah"
  metrik: ["bias_rata_rata", "MAE", "CRPS", "skor_Brier_hujan", "keandalan_probabilitas"]
kemampuan:
  - {id: "cap.fusi_probabilistik", variabel: ["met.gfs", "met.gefs", "met.aigefs", "met.hgefs", "met.bmkg_fc", "obs.bmkg_stn", "obs.isd"], kesiapan: "bisa dimulai"}
  - {id: "cap.koreksi_bias", variabel: ["obs.bmkg_stn", "obs.isd", "obs.gpm"], kesiapan: "sebagian"}
  - {id: "cap.nowcasting", variabel: ["nowcast.radar", "met.bmkg_nowcast", "obs.gpm"], kesiapan: "belum"}
  - {id: "cap.longsor", variabel: ["geo.demnas", "geo.dem_derived", "geo.pvmbg_zone", "obs.gpm", "obs.gsmap", "evt.study", "evt.bpbd"], kesiapan: "paling siap (Jawa)"}
  - {id: "cap.banjir", variabel: ["geo.demnas", "geo.landcover", "geo.soil", "geo.drainage", "obs.river_wl", "obs.tide"], kesiapan: "belum"}
  - {id: "cap.asap", variabel: ["fire.firms", "fire.sipongi", "fire.brin", "fire.drought", "geo.peat", "obs.pm25", "obs.himawari"], kesiapan: "sebagian"}
  - {id: "cap.dampak", variabel: ["geo.exposure", "geo.boundary"], kesiapan: "belum"}
kontrak_keluaran: ["unit_id", "jenis_unit", "modul", "terbit", "berlaku_dari", "berlaku_sampai", "lead", "probabilitas", "tingkat_siaga", "anggota", "versi_model", "koreksi_bias", "sumber_id", "atribusi", "label_istilah", "klaim"]

# Tambahan v2.5 (usulan): pembeda baku
posisi: "Lapisan analisis risiko dampak per unit wilayah yang menggabungkan prakiraan cuaca probabilistik, kondisi lahan, dan verifikasi yang dipublikasikan, dikembangkan bersama atau melengkapi lembaga resmi."
pembeda:
  - id: "D1"
    pernyataan: "Risiko per unit analisis berbasis kondisi lahan"
    variabel: ["geo.demnas", "geo.dem_derived", "geo.pvmbg_zone", "geo.peat", "geo.landcover", "geo.soil", "geo.drainage", "geo.boundary"]
    lapisan_wajib: {longsor: ["geo.pvmbg_zone", "geo.dem_derived"], banjir: ["geo.pvmbg_zone", "geo.dem_derived", "geo.landcover", "geo.soil", "geo.drainage"], asap: ["geo.peat"]}
    pembanding: ["ILEWS", "prakiraan gerakan tanah bulanan PVMBG"]
    status: {longsor: "bisa dibuktikan di pilot (Jawa)", asap: "sebagian", banjir: "belum boleh diklaim"}
    gugur_jika: "skor tidak melampaui pembanding, atau ada lapisan wajib berstatus belum"
  - id: "D2"
    pernyataan: "Probabilitas ensemble sampai ke dampak"
    variabel: ["met.gfs", "met.gefs", "met.aigefs", "met.hgefs"]
    pembanding: ["ambang deterministik GPM (ILEWS atau ambang terbitan)", "GFS/GEFS mentah"]
    status: {semua: "hipotesis"}
    gugur_jika: "keandalan atau Brier tidak lebih baik dari pembanding"
  - id: "D3"
    pernyataan: "Koreksi lokal berbasis pengamatan Indonesia"
    variabel: ["obs.bmkg_stn", "obs.isd", "obs.gpm"]
    pembanding: ["prakiraan BMKG", "GFS/GEFS mentah"]
    status: {semua: "sebagian"}
    gugur_jika: "tidak lebih baik dari pembanding pada variabel, lead, dan wilayah yang sama"
  - id: "D4"
    pernyataan: "Verifikasi terbuka dan dapat ditelusuri"
    variabel: ["obs.bmkg_stn", "obs.isd", "evt.study", "evt.bpbd"]
    pembanding: []
    status: {semua: "belum ada angka (setelah pilot)"}
    gugur_jika: "tidak ada skor dipublikasikan atau metodologi tidak bisa direproduksi"
syarat_masuk:
  - {id: "S1", syarat: "istilah informasi risiko atau analisis pendukung sebelum izin BMKG"}
  - {id: "S2", syarat: "atribusi dan lisensi terpenuhi; tidak ada sumber belum atau sumber tidak independen terhitung ganda"}
  - {id: "S3", syarat: "bahasa probabilitas, tanpa klaim memprediksi pasti"}
  - {id: "S4", syarat: "kemitraan atau pelengkap lembaga resmi, bukan pengganti"}
bukan_pembeda: ["nowcasting AI generik", "prakiraan cuaca umum", "kecepatan atau Rust", "banyaknya sumber data", "AI canggih", "satu-satunya", "peringatan dini"]
aturan_klaim: "klaim berisi kode pembeda yang lulus aturan kelulusan pada modul dan wilayah itu; daftar kosong berarti label eksperimental"
